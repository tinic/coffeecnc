# Builds the CoffeeCNC Debian package for Debian 13 (trixie) with LinuxCNC 2.9 (uspace) from
# linuxcnc.org, amd64 and arm64. A `v*` tag publishes both packages after a clean install and
# purge on both architectures. A manual run or a packaging pull request keeps the artifacts.
#
# Each package depends on exactly the linuxcnc-uspace version it is built against
# (backend/cmake/Packaging.cmake): the NML message layout can change in a patch release. The
# release notes list every package's Depends line.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # A change to the packaging builds both packages before it merges.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - backend/cmake/Packaging.cmake
      - backend/share/**

permissions:
  contents: read

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix: &deb-matrix
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie
      # An init process reaps orphans, as on a real system: the preview engine tests kill a
      # process the helper left behind and wait for it to be gone.
      options: --init
    steps:
      # First: checkout cleans the workspace, which holds the LinuxCNC package cache below.
      - uses: actions/checkout@v4

      - name: Configure the LinuxCNC APT repository
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates gnupg
          # LinuxCNC Archive Signing Key <emcboard@linuxcnc.org>
          gpg --batch --keyserver hkps://keyserver.ubuntu.com \
            --recv-keys 0CE3E44425B11F871BBCC6F5E43B5A8E78CC2927
          gpg --batch --export 0CE3E44425B11F871BBCC6F5E43B5A8E78CC2927 > /usr/share/keyrings/linuxcnc.gpg
          echo "deb [signed-by=/usr/share/keyrings/linuxcnc.gpg] https://www.linuxcnc.org/ trixie base 2.9-uspace" \
            > /etc/apt/sources.list.d/linuxcnc.list
          # linuxcnc.org refuses a connection now and then; apt-get update then succeeds without
          # its index and Debian's own, older linuxcnc-uspace is taken (a package built against it,
          # or an install that cannot be satisfied). Retry until its index is really there.
          # Some runners cannot reach linuxcnc.org over IPv6 at all (every attempt fails there):
          # use IPv4.
          echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
          # A runner that cannot reach it at all builds from the cached packages below.
          reachable=0
          for attempt in 1 2 3 4; do
            apt-get update
            if apt-cache policy linuxcnc-uspace | grep -q 'linuxcnc.org trixie'; then
              reachable=1
              break
            fi
            sleep $((attempt * 10))
          done
          echo "LINUXCNC_ORG=$reachable" >> "$GITHUB_ENV"
          [ "$reachable" = 1 ] || echo "linuxcnc.org trixie index not loaded: using the cached packages"

      # The LinuxCNC packages of the last build that reached linuxcnc.org, per architecture.
      - uses: actions/cache/restore@v4
        with:
          path: linuxcnc-cache
          key: linuxcnc-trixie-${{ matrix.arch }}-v1-${{ github.run_id }}
          restore-keys: linuxcnc-trixie-${{ matrix.arch }}-v1-

      - name: Build tools and LinuxCNC
        run: |
          set -eu
          tools="curl git build-essential cmake ninja-build pkg-config dpkg-dev file
            libgtk-3-dev libwebkit2gtk-4.1-dev nlohmann-json3-dev libboost-dev"
          if [ "$LINUXCNC_ORG" = 1 ]; then
            apt-get install -y --no-install-recommends $tools linuxcnc-uspace-dev
            rm -rf linuxcnc-cache && mkdir linuxcnc-cache
            (cd linuxcnc-cache &&
              apt-get download "linuxcnc-uspace=$(dpkg-query -W -f='${Version}' linuxcnc-uspace)" \
                "linuxcnc-uspace-dev=$(dpkg-query -W -f='${Version}' linuxcnc-uspace-dev)")
          else
            ls linuxcnc-cache/linuxcnc-uspace_*.deb linuxcnc-cache/linuxcnc-uspace-dev_*.deb
            apt-get install -y --no-install-recommends $tools ./linuxcnc-cache/*.deb
          fi
          dpkg-query -W -f='linuxcnc-uspace ${Version}\n' linuxcnc-uspace

      - if: env.LINUXCNC_ORG == '1'
        uses: actions/cache/save@v4
        with:
          path: linuxcnc-cache
          key: linuxcnc-trixie-${{ matrix.arch }}-v1-${{ github.run_id }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Panel
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Native build and portable tests
        working-directory: backend
        run: |
          set -eu
          cmake --preset package -DCOFFEECNC_LINUXCNC=ON
          cmake --build --preset package
          # The same selection as the mill's build: no LinuxCNC session, no display server.
          ctest --preset package -LE linuxcnc -E "xvfb_wrapper|quit_delivery" --output-on-failure

      - name: Package
        working-directory: backend/build/package
        run: |
          set -eu
          cpack -G DEB
          for deb in *.deb; do dpkg-deb -I "$deb" | grep -E "Package|Version|Architecture|Depends"; done

      - uses: actions/upload-artifact@v4
        with:
          name: coffeecnc-${{ matrix.arch }}
          path: backend/build/package/*.deb
          if-no-files-found: error

      # The exact LinuxCNC package this build ran against, for the install check: some runners
      # cannot reach linuxcnc.org at all, and the check must not depend on which one it gets.
      - name: Keep the LinuxCNC package
        run: |
          set -eu
          mkdir -p linuxcnc-debs
          cp linuxcnc-cache/linuxcnc-uspace_*.deb linuxcnc-debs/
          cd linuxcnc-debs
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: linuxcnc-${{ matrix.arch }}
          path: linuxcnc-debs/*.deb
          if-no-files-found: error

  deb_install:
    name: Install and purge (${{ matrix.arch }})
    needs: deb
    strategy:
      fail-fast: false
      matrix: *deb-matrix
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      # Debian's own repositories only: linuxcnc-uspace comes from the build job (the version
      # the package was built against), so this check does not need linuxcnc.org.
      - name: Debian package lists
        run: apt-get update

      - uses: actions/download-artifact@v4
        with:
          name: coffeecnc-${{ matrix.arch }}
          path: package

      - uses: actions/download-artifact@v4
        with:
          name: linuxcnc-${{ matrix.arch }}
          path: linuxcnc

      - name: Install the release artifact with APT
        run: |
          set -eu
          set -- ./package/*.deb
          test "$#" -eq 1
          test -f "$1"
          test "$(dpkg-deb -f "$1" Package)" = coffeecnc
          test "$(dpkg-deb -f "$1" Architecture)" = "$PACKAGE_ARCH"
          test "$(dpkg --print-architecture)" = "$PACKAGE_ARCH"
          for package in coffeecnc linuxcnc-uspace; do
            if dpkg-query -W "$package" 2>/dev/null; then
              echo "Package already present in the clean container: $package" >&2
              exit 1
            fi
          done
          set -- "$1" ./linuxcnc/linuxcnc-uspace_*.deb
          apt-get install -y --no-install-recommends "$@"
          for package in coffeecnc linuxcnc-uspace; do
            test "$(dpkg-query -W -f='${db:Status-Status}' "$package")" = installed
            dpkg-query -W "$package"
          done

      - name: Check packaged files and headless startup
        run: |
          set -eu
          unset DISPLAY WAYLAND_DISPLAY
          panel_help=$(/usr/bin/coffeecnc --help)
          printf '%s\n' "$panel_help" | grep '^usage: coffeecnc '
          preview_status=0
          preview_help=$(/usr/bin/coffeecnc-preview 2>&1) || preview_status=$?
          printf '%s\n' "$preview_help" | grep '^usage: coffeecnc-preview '
          test "$preview_status" -eq 2

          for file in /usr/share/coffeecnc/ui/index.html \
            /usr/share/coffeecnc/coffeecnc.ini.example \
            /usr/share/coffeecnc/hal/coffeecnc_postgui.hal \
            /usr/share/doc/coffeecnc/copyright; do
            test -s "$file"
          done
          dpkg-query -L coffeecnc > installed.paths
          while IFS= read -r path; do
            if [ ! -e "$path" ] && [ ! -L "$path" ]; then
              echo "Missing installed path: $path" >&2
              exit 1
            fi
            # Shared directories such as /usr/bin must remain after purge.
            if [ ! -d "$path" ] || [ -L "$path" ]; then
              printf '%s\n' "$path"
            fi
          done < installed.paths > installed.files

      - name: Purge CoffeeCNC and check for leftovers
        run: |
          set -eu
          apt-get purge -y coffeecnc
          if dpkg-query -W coffeecnc 2>/dev/null; then
            echo "CoffeeCNC remains registered after purge" >&2
            exit 1
          fi
          test -s installed.files
          while IFS= read -r path; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              echo "Package file remains after purge: $path" >&2
              exit 1
            fi
          done < installed.files
          test ! -e /usr/share/coffeecnc
          test ! -e /usr/share/doc/coffeecnc

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb_install
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coffeecnc-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Packages"
            echo
            printf '%s\n' 'Debian 13 (trixie). Each package needs exactly the LinuxCNC version in its Depends line (linuxcnc.org `trixie 2.9-uspace`).'
            echo
            for deb in ./*.deb; do
              printf -- '- `%s`: %s\n' "$(basename "$deb")" "$(dpkg-deb -f "$deb" Depends)"
            done
            echo
          } > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" ./*.deb --repo "$GITHUB_REPOSITORY" \
            --title "CoffeeCNC ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
